document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

3, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"85cb9787-82d4-42f1-816b-8ed544529b96\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"5e8c4f62-ef93-4494-b899-551dbfc729b9\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n\n\n\n<style>\n* { margin:0; padding:0; box-sizing:border-box; }\n\nbody {\n  background: #0e0e0e;\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  padding: 56px 24px 80px;\n  gap: 72px;\n  min-height: 100vh;\n  font-family: 'Space Grotesk', sans-serif;\n}\n\n.tag {\n  font-family: 'Space Grotesk', sans-serif;\n  font-size: 10px;\n  font-weight: 500;\n  letter-spacing: 3px;\n  text-transform: uppercase;\n  color: #3a3a3a;\n  align-self: flex-start;\n  max-width: 1200px;\n  width: 100%;\n  margin-bottom: -58px;\n}\n\n.bwrap {\n  width: 100%;\n  max-width: 1200px;\n  overflow: hidden;\n  box-shadow: 0 32px 100px rgba(0,0,0,0.7);\n}\n\n/* ══════════════════════════════════════════\n   BANNER 1 — NEON RING\n   Dark with massive glowing circle, \n   editorial type, neon-orange halo\n══════════════════════════════════════════ */\n.b1 {\n  height: 440px;\n  background: #0e0e0e;\n  position: relative;\n  overflow: hidden;\n  display: flex;\n  align-items: center;\n}\n\n/* glowing ring */\n.b1-ring {\n  position: absolute;\n  right: -60px;\n  top: 50%;\n  transform: translateY(-50%);\n  width: 540px;\n  height: 540px;\n  border-radius: 50%;\n  border: 80px solid #e8621a;\n  opacity: 0.18;\n  box-shadow: 0 0 80px 20px rgba(232,98,26,0.15), inset 0 0 80px 20px rgba(232,98,26,0.1);\n}\n.b1-ring2 {\n  position: absolute;\n  right: 60px;\n  top: 50%;\n  transform: translateY(-50%);\n  width: 320px;\n  height: 320px;\n  border-radius: 50%;\n  border: 2px solid rgba(232,98,26,0.2);\n}\n\n/* horizontal scan lines */\n.b1-scan {\n  position: absolute;\n  inset: 0;\n  background: repeating-linear-gradient(\n    0deg,\n    transparent,\n    transparent 3px,\n    rgba(255,255,255,0.012) 3px,\n    rgba(255,255,255,0.012) 4px\n  );\n  pointer-events: none;\n}\n\n/* big type */\n.b1-type {\n  position: relative;\n  z-index: 10;\n  padding: 0 72px;\n  flex: 1;\n}\n\n.b1-over {\n  font-family: 'Space Grotesk', sans-serif;\n  font-size: 11px;\n  font-weight: 500;\n  letter-spacing: 6px;\n  text-transform: uppercase;\n  color: #e8621a;\n  margin-bottom: 20px;\n  display: flex;\n  align-items: center;\n  gap: 14px;\n  animation: fadeUp 0.5s ease both;\n}\n.b1-over::before {\n  content: '';\n  display: block;\n  width: 28px;\n  height: 1px;\n  background: #e8621a;\n}\n\n.b1-h {\n  font-family: 'Oswald', sans-serif;\n  font-weight: 700;\n  font-size: 100px;\n  line-height: 0.9;\n  color: #fff;\n  letter-spacing: -1px;\n  animation: fadeUp 0.5s 0.1s ease both;\n}\n.b1-h .dim { color: rgba(255,255,255,0.18); }\n.b1-h .org { color: #e8621a; }\n\n.b1-row {\n  display: flex;\n  align-items: center;\n  gap: 24px;\n  margin-top: 28px;\n  animation: fadeUp 0.5s 0.18s ease both;\n}\n\n.b1-url-box {\n  background: #e8621a;\n  color: #fff;\n  font-family: 'Space Grotesk', sans-serif;\n  font-size: 12px;\n  font-weight: 600;\n  letter-spacing: 2px;\n  text-transform: uppercase;\n  padding: 10px 20px;\n  text-decoration: none;\n}\n\n.b1-desc {\n  font-size: 14px;\n  font-weight: 300;\n  color: rgba(255,255,255,0.35);\n  letter-spacing: 0.5px;\n  max-width: 320px;\n  line-height: 1.5;\n}\n\n/* logo right */\n.b1-logo {\n  position: relative;\n  z-index: 10;\n  padding-right: 72px;\n  flex-shrink: 0;\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  gap: 6px;\n  animation: fadeUp 0.5s 0.22s ease both;\n}\n.b1-lname {\n  font-family: 'Oswald', sans-serif;\n  font-size: 14px;\n  font-weight: 600;\n  letter-spacing: 5px;\n  color: rgba(255,255,255,0.5);\n  text-transform: uppercase;\n  text-align: center;\n}\n.b1-lname span { color: #e8621a; }\n\n/* ══════════════════════════════════════════\n   BANNER 2 — BLUEPRINT\n   Tech-grid engineering drawing aesthetic,\n   teal on near-black, precise & geometric\n══════════════════════════════════════════ */\n.b2 {\n  height: 420px;\n  background: #071620;\n  position: relative;\n  overflow: hidden;\n  display: flex;\n  align-items: center;\n}\n\n/* blueprint grid */\n.b2-grid {\n  position: absolute;\n  inset: 0;\n  background-image:\n    linear-gradient(rgba(26,92,120,0.25) 1px, transparent 1px),\n    linear-gradient(90deg, rgba(26,92,120,0.25) 1px, transparent 1px),\n    linear-gradient(rgba(26,92,120,0.08) 1px, transparent 1px),\n    linear-gradient(90deg, rgba(26,92,120,0.08) 1px, transparent 1px);\n  background-size: 80px 80px, 80px 80px, 16px 16px, 16px 16px;\n}\n\n/* cross marks */\n.b2-cross {\n  position: absolute;\n  width: 20px;\n  height: 20px;\n}\n.b2-cross::before, .b2-cross::after {\n  content: '';\n  position: absolute;\n  background: rgba(26,92,120,0.5);\n}\n.b2-cross::before { width: 1px; height: 100%; left: 50%; }\n.b2-cross::after  { width: 100%; height: 1px; top: 50%; }\n\n/* measurement line */\n.b2-measure {\n  position: absolute;\n  bottom: 60px;\n  left: 72px;\n  right: 72px;\n  height: 1px;\n  background: rgba(26,92,120,0.4);\n}\n.b2-measure::before, .b2-measure::after {\n  content: '';\n  position: absolute;\n  width: 1px;\n  height: 12px;\n  background: rgba(26,92,120,0.4);\n  top: -6px;\n}\n.b2-measure::before { left: 0; }\n.b2-measure::after  { right: 0; }\n\n.b2-measure-label {\n  position: absolute;\n  bottom: 68px;\n  left: 50%;\n  transform: translateX(-50%);\n  font-size: 9px;\n  letter-spacing: 3px;\n  color: rgba(26,92,120,0.6);\n  font-family: 'Space Grotesk', sans-serif;\n  text-transform: uppercase;\n}\n\n/* circle blueprint */\n.b2-blueprint-circle {\n  position: absolute;\n  right: 120px;\n  top: 50%;\n  transform: translateY(-50%);\n  width: 320px;\n  height: 320px;\n}\n\n/* content */\n.b2-content {\n  position: relative;\n  z-index: 10;\n  padding: 0 72px;\n  display: flex;\n  flex-direction: column;\n  justify-content: center;\n  max-width: 620px;\n}\n\n.b2-num {\n  font-family: 'Space Grotesk', sans-serif;\n  font-size: 11px;\n  font-weight: 500;\n  letter-spacing: 5px;\n  color: #1a5c78;\n  text-transform: uppercase;\n  margin-bottom: 16px;\n  animation: fadeUp 0.5s ease both;\n}\n\n.b2-h {\n  font-family: 'Oswald', sans-serif;\n  font-weight: 300;\n  font-size: 80px;\n  line-height: 0.92;\n  color: #fff;\n  letter-spacing: 4px;\n  text-transform: uppercase;\n  animation: fadeUp 0.5s 0.08s ease both;\n}\n.b2-h strong {\n  font-weight: 700;\n  color: #1a5c78;\n  display: block;\n  font-size: 88px;\n}\n.b2-h .accent-line {\n  display: block;\n  color: #e8621a;\n  font-weight: 700;\n}\n\n.b2-spec {\n  margin-top: 22px;\n  display: flex;\n  gap: 32px;\n  animation: fadeUp 0.5s 0.16s ease both;\n}\n\n.b2-spec-item {\n  display: flex;\n  flex-direction: column;\n  gap: 3px;\n}\n.b2-spec-val {\n  font-size: 22px;\n  font-weight: 700;\n  color: #e8621a;\n  font-family: 'Space Grotesk', sans-serif;\n}\n.b2-spec-key {\n  font-size: 9px;\n  letter-spacing: 3px;\n  text-transform: uppercase;\n  color: rgba(255,255,255,0.3);\n}\n\n/* ══════════════════════════════════════════\n   BANNER 3 — SERIF ELEGANCE\n   Warm cream, editorial luxury magazine,\n   DM Serif Display italic, deep teal ink\n══════════════════════════════════════════ */\n.b3 {\n  height: 440px;\n  background: #f5efe6;\n  position: relative;\n  overflow: hidden;\n  display: flex;\n  align-items: stretch;\n}\n\n/* left ink block */\n.b3-ink {\n  width: 380px;\n  flex-shrink: 0;\n  background: #0d3040;\n  position: relative;\n  display: flex;\n  flex-direction: column;\n  justify-content: center;\n  padding: 52px 52px;\n  overflow: hidden;\n}\n\n/* diagonal texture in ink block */\n.b3-ink::after {\n  content: '';\n  position: absolute;\n  inset: 0;\n  background: repeating-linear-gradient(\n    -45deg,\n    transparent,\n    transparent 6px,\n    rgba(255,255,255,0.02) 6px,\n    rgba(255,255,255,0.02) 7px\n  );\n}\n\n.b3-ink-kicker {\n  font-family: 'Space Grotesk', sans-serif;\n  font-size: 10px;\n  font-weight: 500;\n  letter-spacing: 4px;\n  text-transform: uppercase;\n  color: #e8621a;\n  margin-bottom: 20px;\n  position: relative;\n  z-index: 2;\n  animation: fadeUp 0.5s ease both;\n}\n\n.b3-ink-h {\n  font-family: 'DM Serif Display', serif;\n  font-size: 64px;\n  line-height: 1;\n  color: #fff;\n  position: relative;\n  z-index: 2;\n  animation: fadeUp 0.5s 0.08s ease both;\n}\n.b3-ink-h em {\n  font-style: italic;\n  color: #e8621a;\n  display: block;\n}\n\n.b3-ink-rule {\n  width: 48px;\n  height: 2px;\n  background: rgba(255,255,255,0.2);\n  margin: 20px 0;\n  position: relative;\n  z-index: 2;\n  animation: fadeUp 0.5s 0.14s ease both;\n}\n\n.b3-ink-url {\n  font-family: 'Space Grotesk', sans-serif;\n  font-size: 11px;\n  font-weight: 500;\n  letter-spacing: 2px;\n  color: rgba(255,255,255,0.4);\n  position: relative;\n  z-index: 2;\n  text-transform: uppercase;\n  animation: fadeUp 0.5s 0.18s ease both;\n}\n\n/* right cream area */\n.b3-cream {\n  flex: 1;\n  position: relative;\n  display: flex;\n  align-items: center;\n  padding: 0 64px;\n  overflow: hidden;\n}\n\n/* large decorative letter A */\n.b3-deco-a {\n  position: absolute;\n  right: -30px;\n  top: 50%;\n  transform: translateY(-50%);\n  font-famil
