<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- PWA installation & detection script unchanged, only messages updated to 'Abytech Hub' -->
    <!--
        PWA install detection/registration intentionally lives in React now
        (see src/components/pwa/InstallScopeGate.jsx), not here. That component
        only runs inside /admin, which is what keeps the public site
        uninstallable while the dashboard app is installable, and it never
        calls preventDefault() on beforeinstallprompt so the browser's own
        native install UI is what the user sees — no custom dialog.
    -->


    <!-- Fallback for JavaScript disabled -->
    <noscript>
        <div style="
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #e8621a;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-family: system-ui, -apple-system, sans-serif;
            z-index: 9999;
        ">
            <div>
                <h1>JavaScript Required</h1>
                <p>Abytech Hub requires JavaScript to function properly.</p>
                <p>Please enable JavaScript in your browser and refresh the page.</p>
            </div>
        </div>
    </noscript>
</body>
